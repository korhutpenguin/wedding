<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу Михаила и Кристины</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5d4a41; 
            --bg-color: #D1DC93; /* Идеальный фисташковый цвет фона макетов */
            --text-color: #4a3b32;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            text-align: center;
            font-size: 1.3rem;
        }
        
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 40px; background-color: var(--bg-color); }
        
        .top-photo, .content-image {
            width: 100%;
            display: block;
            height: auto;
            margin: 0 auto;
            border: none;
            outline: none;
            padding: 0;
        }
        
        /* Блок адреса, оформленный как аккуратная карточка между изображениями */
        .address-section {
            padding: 25px; 
            margin: 20px 15px;
            background: #fdfefb; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(93, 74, 65, 0.1);
            border: 1px solid rgba(93, 74, 65, 0.15);
        }

        .map-link {
            display: block;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            padding: 5px;
            border-radius: 12px;
        }

        .map-link:hover {
            background-color: rgba(112, 122, 94, 0.08); /* Легкая подсветка при наведении */
        }

        .map-link .place-title {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-style: italic;
        }

        .map-link .place-address {
            font-size: 1rem;
            display: block;
            line-height: 1.4;
            color: #55443b;
            font-weight: 400;
        }
        
        /* Интерактивный блок опросника в самом конце */
        section.rsvp-section { 
            padding: 30px 25px; 
            margin: 25px 15px 10px 15px;
            background: #fdfefb; 
            border-radius: 25px; 
            box-shadow: 0 10px 25px rgba(93, 74, 65, 0.1);
            border: 1px solid rgba(93, 74, 65, 0.15);
        }

        h2 { 
            font-size: 2.2rem; 
            color: var(--primary-color); 
            margin-bottom: 15px; 
            font-weight: 400;
            font-style: italic;
        }
        
        form { display: flex; flex-direction: column; gap: 15px; max-width: 100%; margin: 0 auto; text-align: left; }
        label.form-label { font-weight: 600; color: var(--primary-color); margin-bottom: -5px; display: block; font-size: 1.2rem; }
        
        input[type="text"], select, button { 
            padding: 14px; 
            border: 1px solid rgba(93, 74, 65, 0.3); 
            border-radius: 12px; 
            font-family: inherit; 
            font-size: 1.1rem; 
            width: 100%; 
            background: #fcfcfc;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #707A5E;
            box-shadow: 0 0 5px rgba(112, 122, 94, 0.2);
            background: #ffffff;
        }
        
        .checkbox-group { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #fdfdfd; 
            padding: 15px; 
            border: 1px solid rgba(93, 74, 65, 0.2); 
            border-radius: 12px; 
        }
        .checkbox-label { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; cursor: pointer; color: #4a4a4a; }
        .checkbox-label input { width: 20px; height: 20px; cursor: pointer; accent-color: #707A5E; }

        button { 
            background-color: #707A5E; 
            color: white; 
            border: none; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600; 
            font-size: 1.3rem;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(112, 122, 94, 0.2);
        }
        button:hover { background-color: #5B644D; transform: translateY(-1px); }
        button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Первая картинка (Молодожены) -->
        <img src="photo1.png" alt="Кристина и Михаил" class="top-photo">

        <!-- Перенесенный блок адреса (теперь между картинками) -->
        <div class="address-section">
            <!-- Ссылка на карты по точным географическим координатам -->
            <a href="https://yandex.ru" target="_blank" class="map-link" title="Открыть в Яндекс Картах">
                <span class="place-title">Локация торжества: "Амбар №1"</span>
                <span class="place-address">территория Троицкая Гора, 33А, посёлок Троицкая Гора, Низинское сельское поселение, Ломоносовский район, Ленинградская область, 188501</span>
            </a>
        </div>

        <!-- Вторая картинка (Информация о свадьбе) -->
        <img src="photo2.png" alt="Информация о свадьбе" class="content-image">

        <!-- Опросник RSVP (в конце страницы) -->
        <section class="rsvp-section">
            <h2>Подтвердите присутствие</h2>
            <p style="margin-bottom: 25px; font-size: 1.2rem; color: #66554b;">Пожалуйста, ответьте на вопросы до 15 июня 2027 года.</p>
            
            <form id="rsvpForm">
                <label class="form-label" for="guestName">Ваше имя:</label>
                <input type="text" id="guestName" placeholder="Ваше Имя и Фамилия" required>
                
                <label class="form-label" for="attendance">Присутствие:</label>
                <select id="attendance" required>
                    <option value="" disabled selected>Сможете ли вы прийти?</option>
                    <option value="Да, приду">Да, с удовольствием приду</option>
                    <option value="Не смогу">К сожалению, не смогу</option>
                </select>
                
                <label class="form-label">Предпочтения по алкоголю:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Красное вино"> Красное вино</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Белое вино"> Белое вино</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Игристое вино / Шампанское"> Игристое вино / Шампанское</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Крепкий алкоголь"> Крепкий алкоголь</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Безалкогольные напитки"> Не пью алкоголь</label>
                </div>
                
                <button type="submit" id="submitBtn">Отправить ответ</button>
            </form>
        </section>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://google.com';

        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const name = document.getElementById('guestName').value;
            const attendance = document.getElementById('attendance').value;
            
            const checkedAlcohol = Array.from(document.querySelectorAll('input[name="alcohol"]:checked'))
                                        .map(cb => cb.value)
                                        .join(', ');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            const formData = {
                name: name,
                attendance: attendance,
                preferences: checkedAlcohol || 'Не выбрано'
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('Спасибо, ' + name + '! Ваш ответ успешно записан в таблицу.');
                document.getElementById('rsvpForm').reset();
            })
            .catch(error => {
                alert('Произошла ошибка при отправке. Пожалуйста, попробуйте еще раз.');
                console.error('Ошибка:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Отправить ответ';
            });
        });
    </script>

</body>
</html>
