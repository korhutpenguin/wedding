<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу Михаила и Кристины</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5d4a41;
            --bg-color: #D1DC93;
            --text-color: #4a3b32;
            --accent-color: #707A5E;
            --accent-hover: #5B644D;
            --card-bg: #fdfefb;
            --shadow: 0 10px 25px rgba(93, 74, 65, 0.1);
            --border-light: 1px solid rgba(93, 74, 65, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            text-align: center;
            font-size: 1.3rem;
            -webkit-user-select: text;
            user-select: text;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 40px;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .top-photo, .content-image {
            width: 100%;
            display: block;
            height: auto;
            margin: 0 auto;
            border: none;
            outline: none;
            padding: 0;
            animation: fadeInUp 0.8s ease-out both;
        }

        .content-image { animation-delay: 0.2s; }

        .address-section-link {
            display: block;
            margin: 20px 15px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: var(--border-light);
            text-decoration: none;
            color: inherit;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .address-section-link:hover {
            background-color: #f6f8f0;
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(93, 74, 65, 0.15);
        }

        .address-section-link:active { transform: translateY(0); }

        .address-text-container { padding: 25px 20px; pointer-events: auto; }

        .place-title {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-style: italic;
            line-height: 1.2;
        }

        .place-address {
            font-size: 1.1rem;
            display: block;
            line-height: 1.4;
            color: #55443b;
            font-weight: 400;
        }

        section.rsvp-section {
            padding: 30px 25px;
            margin: 25px 15px 10px 15px;
            background: var(--card-bg);
            border-radius: 25px;
            box-shadow: var(--shadow);
            border: var(--border-light);
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        h2 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            font-weight: 400;
            font-style: italic;
        }

        .rsvp-subtitle {
            margin-bottom: 25px;
            font-size: 1.2rem;
            color: #66554b;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
            margin: 0 auto;
            text-align: left;
        }

        label.form-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: -5px;
            display: block;
            font-size: 1.2rem;
        }

        input[type="text"], select, button {
            padding: 14px;
            border: 1px solid rgba(93, 74, 65, 0.3);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            width: 100%;
            background: #fcfcfc;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(112, 122, 94, 0.15);
            background: #ffffff;
        }

        input[type="text"]:invalid:not(:placeholder-shown) { border-color: #c0392b; }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fdfdfd;
            padding: 15px;
            border: 1px solid rgba(93, 74, 65, 0.2);
            border-radius: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #4a4a4a;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .checkbox-label:hover { color: var(--primary-color); }

        .checkbox-label input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1.3rem;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(112, 122, 94, 0.2);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(112, 122, 94, 0.3);
        }

        button:active { transform: translateY(0); }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(74, 59, 50, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 35px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(74, 59, 50, 0.3);
            transform: scale(0.9) translateY(10px);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .modal-overlay.active .modal { transform: scale(1) translateY(0); }

        .modal-icon { font-size: 3rem; margin-bottom: 15px; display: block; }

        .modal-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            font-style: italic;
            margin-bottom: 10px;
        }

        .modal-text {
            font-size: 1.15rem;
            color: #66554b;
            margin-bottom: 25px;
        }

        .modal-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
        }

        .modal-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 400px) {
            body { font-size: 1.15rem; }
            .place-title { font-size: 1.5rem; }
            .place-address { font-size: 1rem; }
            h2 { font-size: 1.8rem; }
            section.rsvp-section { padding: 25px 18px; margin: 20px 10px 10px 10px; }
            .address-section-link { margin: 15px 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="photo1.png" alt="Кристина и Михаил" class="top-photo">

        <a class="address-section-link" href="https://yandex.ru/maps/10174/saint-petersburg-and-leningrad-oblast/house/territoriya_troitskaya_gora_33a/ZkAYfgRlQEIHQFtjfXR3dnVhYw==/?ll=29.835970%2C59.867927&z=17" target="_blank" rel="noopener noreferrer">
            <div class="address-text-container">
                <span class="place-title">Локация торжества: «Амбар №1»</span>
                <span class="place-address">территория Троицкая Гора, 33А, посёлок Троицкая Гора, Низинское сельское поселение, Ломоносовский район, Ленинградская область, 188501</span>
            </div>
        </a>

        <img src="photo2.png" alt="Информация о свадьбе" class="content-image">

        <section class="rsvp-section">
            <h2>Подтвердите присутствие</h2>
            <p class="rsvp-subtitle">Пожалуйста, ответьте на вопросы до 15 июня 2027 года.</p>

            <form id="rsvpForm" novalidate>
                <label class="form-label" for="guestName">Ваше имя:</label>
                <input type="text" id="guestName" name="name" placeholder="Ваше Имя и Фамилия" required autocomplete="name" minlength="2">

                <label class="form-label" for="attendance">Присутствие:</label>
                <select id="attendance" name="attendance" required>
                    <option value="" disabled selected>Сможете ли вы прийти?</option>
                    <option value="Да, приду">Да, с удовольствием приду</option>
                    <option value="Не смогу">К сожалению, не смогу</option>
                </select>

                <label class="form-label">Предпочтения по алкоголю:</label>
                <div class="checkbox-group" role="group" aria-label="Предпочтения по алкоголю">
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Красное вино"> Красное вино</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Белое вино"> Белое вино</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Игристое вино / Шампанское"> Игристое вино / Шампанское</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Крепкий алкоголь"> Крепкий алкоголь</label>
                    <label class="checkbox-label"><input type="checkbox" name="alcohol" value="Безалкогольные напитки"> Не пью алкоголь</label>
                </div>

                <button type="submit" id="submitBtn">Отправить ответ</button>
            </form>
        </section>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <span class="modal-icon" id="modalIcon">💌</span>
            <h3 class="modal-title" id="modalTitle">Спасибо!</h3>
            <p class="modal-text" id="modalText"></p>
            <button class="modal-btn" id="modalClose">Хорошо</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbza5408nofoVby44zwsssadZjXEXhuhvmG3g2_bFtKuNZLnznpwwp_stlcbFdYkyPycOA/exec';

        const form = document.getElementById('rsvpForm');
        const submitBtn = document.getElementById('submitBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalClose = document.getElementById('modalClose');

        let isSending = false;

        function showModal(icon, title, text) {
            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalText.textContent = text;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) hideModal();
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (isSending) return;

            const nameInput = document.getElementById('guestName');
            const attendanceInput = document.getElementById('attendance');

            if (!nameInput.value.trim() || nameInput.value.trim().length < 2) {
                nameInput.focus();
                nameInput.reportValidity();
                return;
            }

            if (!attendanceInput.value) {
                attendanceInput.focus();
                attendanceInput.reportValidity();
                return;
            }

            const name = nameInput.value.trim();
            const attendance = attendanceInput.value;

            const checkedAlcohol = Array.from(document.querySelectorAll('input[name="alcohol"]:checked'))
                                        .map(cb => cb.value)
                                        .join(', ');

            isSending = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Отправка...';

            const formData = new FormData();
            formData.append('name', name);
            formData.append('attendance', attendance);
            formData.append('preferences', checkedAlcohol || 'Не выбрано');

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.result === 'success') {
                    showModal('💌', 'Спасибо, ' + name + '!', 'Ваш ответ успешно записан. Мы очень ждём встречи!');
                    form.reset();
                } else {
                    throw new Error((data && data.message) || 'Скрипт вернул неизвестный ответ');
                }
            })
            .catch(error => {
                console.error('Ошибка отправки:', error);
                showModal('⚠️', 'Не удалось отправить', 'Пожалуйста, проверьте подключение к интернету и попробуйте ещё раз.');
            })
            .finally(() => {
                isSending = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить ответ';
            });
        });
    </script>

</body>
</html>
